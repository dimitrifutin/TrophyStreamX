name: TrophyStream Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - "TrophyStream-reconstruction-source/TrophyStream-project/**"
      - ".github/workflows/trophystream-build.yml"

jobs:
  check:
    runs-on: windows-2022
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        shell: pwsh
        run: |
          $project = "TrophyStream-reconstruction-source/TrophyStream-project"
          if (!(Test-Path "$project/plugin/CMakeLists.txt")) {
            throw "Plugin CMakeLists.txt not found"
          }
          if (!(Test-Path "$project/plugin/trophy-stream.c")) {
            throw "Plugin source not found"
          }
          Write-Host "TrophyStream source files found."
          Get-Content "$project/plugin/CMakeLists.txt"
